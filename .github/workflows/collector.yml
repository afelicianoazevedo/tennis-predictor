name: Tennis Collector

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - upcoming
          - live
          - results
          - odds

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: collector
        run: npm ci

      - name: Run collector
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MINUTE=$(date -u +%M)
            HOUR=$(date -u +%H)
            if [ "$MINUTE" == "00" ] && { [ "$HOUR" == "00" ] || [ "$HOUR" == "12" ]; }; then
              MODE="all"
            elif [ "$MINUTE" == "00" ]; then
              MODE="live"
            else
              MODE="all"
            fi
          fi
          echo "Running collector in mode: $MODE"
          node collector.js $MODE
        continue-on-error: true

      - name: Commit state changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add collector/state.json
          git diff --cached --quiet && echo "No state changes to commit" && exit 0
          git commit -m "chore: update collector state [skip ci]"
          git push

      - name: Commit state changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add collector/state.json
          git diff --cached --quiet && echo "No state changes to commit" && exit 0
          git commit -m "chore: update collector state [skip ci]"
          git push
