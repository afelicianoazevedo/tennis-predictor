name: Tennis Predictor Sync

on:
  schedule:
    - cron: '*/3 * * * *'       # Sync every 3 minutes (24/7)
  workflow_dispatch:            # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync matches from SportScore
        run: |
          curl -s -X GET \
            "https://ywmrxvurnxgnmpcjnisi.supabase.co/functions/v1/update-tennis-data?mode=sync" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Generate predictions
        run: |
          curl -s -X POST \
            "https://ywmrxvurnxgnmpcjnisi.supabase.co/rest/v1/rpc/generate_all_predictions" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d ''
